apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: statistiques-deployment
  labels:
    app: statistiques-MS
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statistiques-MS
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: statistiques-MS
    spec:
      containers:
      - name: statistiques-container
        image: registry.gitlab.com/gitlabodix/cvtheque-statistiques-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Never
        ports:
        - containerPort: 8006
      imagePullSecrets:
      - name: gitlab-secrets-statistiques-ms
---
apiVersion: v1
kind: Service
metadata:
  name: statistiques-service
spec:
  selector:
    app: statistiques-MS
  ports:
    - port: 8006
      targetPort: 8006

