#################### Deployment ####################
---
apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: statistiques-deployment
  labels:
    app: statistiques
spec:
  replicas: 2
  selector:
    matchLabels:
      app: statistiques
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: statistiques
    spec:
      containers:
      - name: statistiques-container
        image: registry.gitlab.com/gitlabodix/cvtheque-statistiques-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Always
        ports:
        - containerPort: 8006
      imagePullSecrets:
      - name: gitlab-secrets-statistiques-ms
#################### Service ####################
---
apiVersion: v1
kind: Service
metadata:
  name: statistiques-ms
spec:
  selector:
    app: statistiques
  ports:
    - port: 8006
      targetPort: 8006


